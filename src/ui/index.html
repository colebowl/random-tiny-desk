<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Random Tiny Desk Video</title>
    <meta name="description" content="Watch a randomly selected NPR Tiny Desk Concert. A delightful surprise every time, made with love by Cole Reid at the Recurse Center."/>
    <meta name="keywords" content="Tiny Desk, NPR, Random Video, Concerts, Music, Cole Reid, Recurse Center"/>
    <meta name="author" content="Cole Reid"/>
    <link rel="canonical" href="https://random-tiny-desk-concert.colere.id/"/>
    <meta name="referrer" content="strict-origin-when-cross-origin"/>

    <meta property="og:title" content="Random Tiny Desk Concert"/>
    <meta property="og:description" content="Watch a randomly selected NPR Tiny Desk Concert. Hit refresh and get surprised!"/>
    <meta property="og:image" content="https://random-tiny-desk-concert.colere.id/images/preview.jpg"/>
    <meta property="og:url" content="https://random-tiny-desk-concert.colere.id/"/>
    <meta property="og:type" content="website"/>

    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Random Tiny Desk Concert"/>
    <meta name="twitter:description" content="Watch a randomly selected NPR Tiny Desk Concert. A delightful surprise every time!"/>
    <meta name="twitter:image" content="https://random-tiny-desk-concert.colere.id/images/preview.jpg"/>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Random Tiny Desk Concert",
        "url": "https://random-tiny-desk-concert.colere.id/",
        "author": {
          "@type": "Person",
          "name": "Cole Reid",
          "url": "https://colere.id"
        },
        "description": "Watch a randomly selected NPR Tiny Desk Concert. A delightful surprise every time, made at Recurse by Cole Reid.",
        "inLanguage": "en"
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "npr-red": "#D62021",
              "npr-black": "#000000",
              "npr-blue": "#237BBD"
            }
          }
        }
      }

      const randomIndex = (min, max) => {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        const normalized = array[0] / (0xFFFFFFFF + 1);
        return Math.floor(min + normalized * (max - min));
      }

      const resizePlayer = () => {
        const iframe = document.getElementById('video');
        const parent = iframe.parentElement;

        if (iframe && parent) {
          const parentWidth = parent.offsetWidth;
          const parentHeight = parent.offsetHeight;

          // left this in head in case i want to tune it later
          iframe.style.width = (parentWidth * 1) + 'px';
          iframe.style.height = (parentHeight * 1) + 'px';
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        resizePlayer();

        window.addEventListener('resize', resizePlayer);

        const json = fetch('/items.json')
          .then(res => res.json())
          .then(items => {

            const videoIndex = randomIndex(0, items.length - 1);
            const video = items[videoIndex];

            document
              .getElementById("video")
              .src = `https://www.youtube.com/embed/${video.id}`
          })

      })
    </script>
  </head>
  <body class="min-h-screen flex flex-col h-screen w-screen">
    <div class="my-4 flex flex-col items-center">
      <h1 class="text-2xl font-bolder ">Random NPR Tiny Desk Concert</h1>
      <p class="font-mono text-xs my-2"> By <a href="https://colere.id?utm_source=random-tiny-desk" class="text-npr-blue hover:underline" target="_blank">Cole Reid</a> &mdash; Made at <a href="https://recurse.com" class="text-npr-blue hover:underline" target="_blank">Recurse</a>
      </p>
    </div>

    <div class="flex flex-row">
      <div class="flex w-1/3 h-8 bg-npr-red"></div>
      <div class="flex w-1/3 h-8 bg-npr-black"></div>
      <div class="flex w-1/3 h-8 bg-npr-blue"></div>
    </div>

    <div class="flex-1 w-auto p-2 md:p-4 xl:p-20 d-flex flex-col">
      <section class="flex items-center justify-center h-full">
        <iframe id="video" width="560" height="315" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </section>
    </div>
  </div>

  <footer class="text-center text-xs m-2">This site is in no way affiliated with NPR. I just <span class="text-npr-red">❤</span> this concert series! <a href="https://www.npr.org/donations/support" class="text-npr-blue hover:underline" target="_blank">Support NPR</a>
  </footer>
</body>
</html>
